<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MM QR keypad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  :root {
    --bg: #E4E6E2;
    --ink: #1C232B;
    --muted: #6B747C;
    --key: #F6F7F4;
    --key-press: #D6D9D3;
    --line: #C3C8C2;
    --steel: #34506B;
    --hivis: #FFC72C;
    --hivis-press: #E8B01A;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1E252C; --ink: #EDEFEA; --muted: #9AA3AA; --key: #2B343D;
      --key-press: #39444F; --line: #3D4853; --steel: #8FB0CF;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1E252C; --ink: #EDEFEA; --muted: #9AA3AA; --key: #2B343D;
    --key-press: #39444F; --line: #3D4853; --steel: #8FB0CF;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Barlow", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    max-width: 940px;
    margin: 0 auto;
    padding: 20px 16px 28px;
    display: grid;
    gap: 20px;
  }
  @media (min-width: 760px) {
    main { grid-template-columns: 1.05fr 1fr; align-items: start; padding-top: 36px; gap: 32px; }
  }
  h1 {
    grid-column: 1 / -1;
    margin: 0;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    letter-spacing: 0.01em;
  }

  /* The label: always white with black modules so scanners read it */
  .label {
    background: #FFFFFF;
    color: #111418;
    border-radius: 6px;
    padding: 22px 22px 16px;
    border: 2px solid var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .qr { width: 100%; max-width: 340px; aspect-ratio: 1; display: grid; place-items: center; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .empty {
    width: 86%; aspect-ratio: 1;
    border: 2px dashed #B9BEB8;
    border-radius: 4px;
    display: grid; place-items: center;
    text-align: center; padding: 16px;
    color: #6B747C; font-size: 1.05rem; line-height: 1.4;
  }
  .code {
    margin-top: 10px;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: clamp(2.6rem, 9vw, 3.6rem);
    line-height: 1;
    letter-spacing: 0.02em;
    min-height: 1em;
  }

  /* Input side */
  .panel { display: grid; gap: 12px; }
  .readout {
    display: flex; align-items: baseline; gap: 4px;
    border-bottom: 3px solid var(--ink);
    padding: 0 4px 6px;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 600;
    font-size: 2.6rem;
    line-height: 1.1;
    min-height: 3.6rem;
  }
  .readout .prefix { color: var(--muted); }
  .readout .digits { color: var(--ink); }
  .readout .placeholder { color: var(--muted); opacity: .55; }

  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  button {
    font: inherit;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 600;
    font-size: 1.9rem;
    min-height: 62px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--key);
    color: var(--ink);
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
  }
  button:active, button.pressed { background: var(--key-press); transform: translateY(1px); }
  button:focus-visible { outline: 3px solid var(--steel); outline-offset: 2px; }
  .keys .util { font-family: "Barlow", Arial, sans-serif; font-size: 1.05rem; font-weight: 600; color: var(--steel); }

  .step { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
  .step button { font-size: 1.35rem; }
  .next { background: var(--hivis); border-color: var(--hivis-press); color: #1C232B; }
  .next:active, .next.pressed { background: var(--hivis-press); }
  button:disabled { opacity: .4; cursor: default; transform: none; }

  .extra { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: .95rem; margin: 0; }
  .print {
    min-height: 44px; padding: 0 18px; font-size: 1.1rem;
    background: transparent; border: 2px solid var(--ink);
  }
  .error { color: #B3261E; font-size: 1rem; }

  @media (prefers-reduced-motion: reduce) {
    button:active, button.pressed { transform: none; }
  }

  @media print {
    body { background: #fff; }
    h1, .panel { display: none !important; }
    main { display: block; padding: 0; }
    .label { border: none; padding: 0; margin: 40px auto; width: 70mm; }
    .qr { max-width: none; }
  }
</style>
</head>
<body>
<main>
  <h1>MM QR keypad</h1>

  <section class="label" aria-live="polite">
    <div class="qr" id="qr">
      <div class="empty">Type a number on the keypad to make a code</div>
    </div>
    <div class="code" id="codeText"></div>
  </section>

  <section class="panel">
    <div class="readout" aria-label="Current code">
      <span class="prefix">MM</span><span class="digits" id="digits"></span><span class="placeholder" id="ph">0</span>
    </div>

    <div class="keys" id="keys">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="clear" class="util">Clear</button>
      <button data-k="0">0</button>
      <button data-k="back" class="util" aria-label="Delete last digit">⌫</button>
    </div>

    <div class="step">
      <button data-k="prev" id="prevBtn" aria-label="Previous number">− 1</button>
      <button data-k="next" class="next" aria-label="Next number">Next  + 1</button>
    </div>

    <div class="extra">
      <p class="hint">Your keyboard's number keys work too. Arrow up/down steps through codes.</p>
      <button class="print" id="printBtn" disabled>Print label</button>
    </div>
    <p class="error" id="err" hidden>The QR library didn't load. Check your connection and reload the page.</p>
  </section>
</main>

<script>
(function () {
  var MAX = 6;
  var value = "";
  var digitsEl = document.getElementById("digits");
  var phEl = document.getElementById("ph");
  var qrEl = document.getElementById("qr");
  var codeEl = document.getElementById("codeText");
  var printBtn = document.getElementById("printBtn");
  var prevBtn = document.getElementById("prevBtn");
  var emptyHTML = qrEl.innerHTML;

  try { var saved = localStorage.getItem("mm-last"); if (saved && /^[1-9]\d{0,5}$/.test(saved)) value = saved; } catch (e) {}

  function svgFor(text) {
    var qr = qrcode(0, "M");
    qr.addData(text);
    qr.make();
    var n = qr.getModuleCount(), q = 4, size = n + q * 2, d = "";
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        if (qr.isDark(r, c)) d += "M" + (c + q) + " " + (r + q) + "h1v1h-1z";
      }
    }
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + " " + size +
      '" shape-rendering="crispEdges" role="img" aria-label="QR code for ' + text + '">' +
      '<rect width="' + size + '" height="' + size + '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
  }

  function render() {
    digitsEl.textContent = value;
    phEl.style.display = value ? "none" : "";
    prevBtn.disabled = !value || value === "1";
    printBtn.disabled = !value;
    try { if (value) localStorage.setItem("mm-last", value); else localStorage.removeItem("mm-last"); } catch (e) {}

    if (!value) { qrEl.innerHTML = emptyHTML; codeEl.textContent = ""; return; }
    var text = "MM" + value;
    codeEl.textContent = text;
    if (typeof qrcode !== "function") { document.getElementById("err").hidden = false; return; }
    qrEl.innerHTML = svgFor(text);
  }

  function press(k) {
    if (/^\d$/.test(k)) {
      if (value === "" && k === "0") return;          // no leading zeros
      if (value.length < MAX) value += k;
    } else if (k === "back") {
      value = value.slice(0, -1);
    } else if (k === "clear") {
      value = "";
    } else if (k === "next") {
      value = String((parseInt(value || "0", 10) + 1));
      if (value.length > MAX) value = value.slice(0, MAX);
    } else if (k === "prev") {
      var n = parseInt(value || "0", 10);
      if (n > 1) value = String(n - 1);
    }
    render();
  }

  document.querySelectorAll("button[data-k]").forEach(function (b) {
    b.addEventListener("click", function () { press(b.getAttribute("data-k")); });
  });
  printBtn.addEventListener("click", function () { window.print(); });

  var keyMap = { Backspace: "back", Delete: "clear", Escape: "clear", ArrowUp: "next", ArrowRight: "next", "+": "next", ArrowDown: "prev", ArrowLeft: "prev", "-": "prev" };
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = /^\d$/.test(e.key) ? e.key : keyMap[e.key];
    if (!k) return;
    e.preventDefault();
    press(k);
    var btn = document.querySelector('button[data-k="' + k + '"]');
    if (btn) { btn.classList.add("pressed"); setTimeout(function () { btn.classList.remove("pressed"); }, 110); }
  });

  render();
})();
</script>
</body>
</html>
